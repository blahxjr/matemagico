services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-matemagico_staging}
      POSTGRES_USER: ${POSTGRES_USER:-matemagico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build: .
    command: npm run db:migrate:deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-matemagico}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-matemagico_staging}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  seed:
    build: .
    command: npm run seed
    profiles: ['seed']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-matemagico}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-matemagico_staging}?schema=public
      SEED_DEMO: 'true'
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@matemagico.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    command: npm run start --workspace @matemagico/api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-matemagico}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-matemagico_staging}?schema=public
      PORT: '3333'
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - '${API_PORT:-3333}:3333'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3333/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build: .
    command: npm run start --workspace @matemagico/web
    environment:
      API_URL: http://api:3333
      PORT: '3000'
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  staging-postgres:
