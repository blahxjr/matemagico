services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matemagico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - matemagico-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d matemagico']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  matemagico-postgres:
